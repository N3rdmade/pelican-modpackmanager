name: Import v1.6.10 package

on:
  push:
    branches:
      - v1.6.10-upstream
    paths:
      - '.v1610-stage/READY'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Release v1.6.10'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.6.10-upstream

      - name: Rebuild and import package
        run: |
          set -euo pipefail
          cat .v1610-stage/part*.b64 | base64 -d > /tmp/modpack-manager-v1.6.10.zip
          rm -rf /tmp/v1610
          mkdir -p /tmp/v1610
          unzip -q /tmp/modpack-manager-v1.6.10.zip -d /tmp/v1610
          test -f /tmp/v1610/modpack-manager/plugin.json
          rsync -a /tmp/v1610/modpack-manager/ ./
          rm -rf .v1610-stage
          rm -f .github/workflows/import-v1.6.10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.6.10"
          git push origin HEAD:v1.6.10-upstream
