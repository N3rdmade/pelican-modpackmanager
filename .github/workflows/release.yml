name: Build & Release

on:
  push:
    tags:
      - 'v*'          # e.g. v1.0.1 — pushing a tag cuts a release
  workflow_dispatch:   # …or run it manually from the Actions tab
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1). Leave blank to use plugin.json version.'
        required: false

permissions:
  contents: write       # needed to create releases / upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${GITHUB_REF#refs/tags/}" ] && [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' plugin.json | grep -oE '[0-9][^"]*')"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as: ${TAG}"

      - name: Build plugin zip
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/modpack-manager
          # Copy everything except VCS/CI cruft into the top-level plugin folder
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.DS_Store' \
            --exclude '*.tar.gz' \
            --exclude '*.zip' \
            ./ build/modpack-manager/
          ( cd build && zip -r -q -X ../modpack-manager.zip modpack-manager -x '*.DS_Store' )
          echo "--- zip contents (top level) ---"
          unzip -l modpack-manager.zip | head -n 20
          # Sanity check: plugin.json must be at modpack-manager/plugin.json
          unzip -l modpack-manager.zip | grep -q 'modpack-manager/plugin.json'

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: modpack-manager.zip
