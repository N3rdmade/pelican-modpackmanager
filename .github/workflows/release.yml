name: Build & Release

on:
  push:                # every push — version in plugin.json drives the tag
  workflow_dispatch:    # …or run it manually from the Actions tab

permissions:
  contents: write       # needed to create releases / upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from plugin.json
        id: ver
        run: |
          VERSION="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' plugin.json | grep -oE '[0-9][^"]*')"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from plugin.json"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing as: v${VERSION}"

      - name: Build plugin zip
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/modpack-manager
          # Copy everything except VCS/CI cruft into the top-level plugin folder
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.DS_Store' \
            --exclude '*.tar.gz' \
            --exclude '*.zip' \
            ./ build/modpack-manager/
          ( cd build && zip -r -q -X ../modpack-manager.zip modpack-manager -x '*.DS_Store' )
          echo "--- zip contents (top level) ---"
          unzip -l modpack-manager.zip | head -n 20
          # Sanity check: plugin.json must be at modpack-manager/plugin.json
          unzip -l modpack-manager.zip | grep -q 'modpack-manager/plugin.json'

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: modpack-manager.zip
